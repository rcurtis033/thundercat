[project]
name = "thundercat"
version = "0.1.0"
description = "GPT (OpenAI) and Grok 4 (xAI) as tool-using agents: CLI, Python API, and an MCP server for Claude Code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.22.3,<0.23",
    "openai>=3.19,<4",
    "mcp>=2.2,<3",
    "python-dotenv>=1.2",
]

[project.scripts]
thundercat = "thundercat.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
    "live: calls the real OpenAI / xAI APIs (needs API keys; run with `pytest -m live`)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
